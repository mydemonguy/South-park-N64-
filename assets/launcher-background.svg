<?xml version="1.0" encoding="utf-8"?>
<!-- Original artwork for the launcher background: a snowy cartoon mountain town on a bright winter day.
     Flat shapes with bold outlines; no characters, logos or artwork from any existing work. -->
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 498.5 461.1">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5EC3FF"/>
      <stop offset="1" stop-color="#C9EEFF"/>
    </linearGradient>
    <linearGradient id="snow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#DCEBFA"/>
    </linearGradient>
  </defs>

  <!-- Sky and sun -->
  <rect x="0" y="0" width="498.5" height="461.1" fill="url(#sky)"/>
  <g stroke="#FFE27A" stroke-width="6" stroke-linecap="round">
    <path d="M420 18 L420 4 M420 112 L420 126 M366 65 L352 65 M474 65 L488 65 M382 27 L372 17 M458 103 L468 113 M458 27 L468 17 M382 103 L372 113"/>
  </g>
  <circle cx="420" cy="65" r="36" fill="#FFD23F" stroke="#E8A400" stroke-width="4"/>

  <!-- Clouds -->
  <g fill="#FFFFFF" stroke="#9FCBEA" stroke-width="3">
    <path d="M40 92 Q40 70 62 72 Q70 52 94 60 Q112 46 128 66 Q150 64 150 86 Q150 100 132 100 L56 100 Q40 100 40 92 Z"/>
    <path d="M210 50 Q212 34 230 36 Q240 20 260 28 Q276 20 284 38 Q302 38 300 54 Q298 64 284 64 L224 64 Q210 64 210 50 Z"/>
  </g>

  <!-- Far mountains -->
  <path d="M-10 262 L70 150 L118 196 L190 104 L262 200 L310 160 L372 226 L436 150 L510 240 L510 300 L-10 300 Z"
        fill="#7FA7D9" stroke="#2D4A73" stroke-width="4" stroke-linejoin="round"/>
  <path d="M70 150 L92 181 L80 176 L70 188 L59 176 L50 180 Z
           M190 104 L218 141 L204 134 L190 150 L176 134 L162 140 Z
           M310 160 L330 187 L318 182 L309 192 L300 182 L291 186 Z
           M436 150 L460 182 L446 176 L436 188 L426 176 L413 181 Z"
        fill="#FFFFFF" stroke="#2D4A73" stroke-width="3" stroke-linejoin="round"/>

  <!-- Near hills -->
  <path d="M-10 300 L60 248 L128 286 L196 244 L272 292 L344 252 L420 294 L510 256 L510 362 L-10 362 Z"
        fill="#5A84BF" stroke="#2D4A73" stroke-width="4" stroke-linejoin="round"/>

  <!-- Pine trees -->
  <g stroke="#173B2E" stroke-width="3" stroke-linejoin="round">
    <g transform="translate(26,318)"><rect x="-3" y="-2" width="6" height="12" fill="#5B3A24"/><path d="M0 -58 L20 -22 L-20 -22 Z M0 -40 L26 0 L-26 0 Z" fill="#2E7D5B"/><path d="M0 -58 L7 -45 L-7 -45 Z" fill="#FFFFFF"/></g>
    <g transform="translate(470,316) scale(1.1)"><rect x="-3" y="-2" width="6" height="12" fill="#5B3A24"/><path d="M0 -58 L20 -22 L-20 -22 Z M0 -40 L26 0 L-26 0 Z" fill="#2E7D5B"/><path d="M0 -58 L7 -45 L-7 -45 Z" fill="#FFFFFF"/></g>
    <g transform="translate(232,306) scale(0.75)"><rect x="-3" y="-2" width="6" height="12" fill="#5B3A24"/><path d="M0 -58 L20 -22 L-20 -22 Z M0 -40 L26 0 L-26 0 Z" fill="#2E7D5B"/><path d="M0 -58 L7 -45 L-7 -45 Z" fill="#FFFFFF"/></g>
  </g>

  <!-- Town: a row of bright little buildings with snowy roofs -->
  <g stroke="#1E2B40" stroke-width="3.5" stroke-linejoin="round">
    <!-- red shop -->
    <g transform="translate(52,300)">
      <rect x="0" y="0" width="84" height="54" fill="#E8483B"/>
      <rect x="-4" y="-12" width="92" height="14" fill="#FFFFFF"/>
      <rect x="10" y="14" width="26" height="20" fill="#9FE0FF"/>
      <rect x="50" y="18" width="22" height="36" fill="#7A2A1F"/>
    </g>
    <!-- yellow house -->
    <g transform="translate(148,296)">
      <rect x="0" y="0" width="66" height="58" fill="#FFC72C"/>
      <path d="M-8 2 L33 -34 L74 2 Z" fill="#FFFFFF"/>
      <rect x="10" y="14" width="18" height="16" fill="#9FE0FF"/>
      <rect x="38" y="22" width="18" height="36" fill="#6B4A1E"/>
    </g>
    <!-- green house -->
    <g transform="translate(228,304)">
      <rect x="0" y="0" width="70" height="50" fill="#3DBE7A"/>
      <path d="M-8 2 L35 -30 L78 2 Z" fill="#FFFFFF"/>
      <rect x="10" y="12" width="20" height="16" fill="#9FE0FF"/>
      <rect x="42" y="12" width="18" height="16" fill="#9FE0FF"/>
    </g>
    <!-- purple shop -->
    <g transform="translate(312,298)">
      <rect x="0" y="0" width="90" height="56" fill="#8E5BD6"/>
      <rect x="-4" y="-12" width="98" height="14" fill="#FFFFFF"/>
      <rect x="10" y="14" width="30" height="22" fill="#9FE0FF"/>
      <rect x="52" y="20" width="24" height="36" fill="#3F2366"/>
    </g>
    <!-- blue house -->
    <g transform="translate(416,302)">
      <rect x="0" y="0" width="64" height="52" fill="#3A8EE6"/>
      <path d="M-8 2 L32 -32 L72 2 Z" fill="#FFFFFF"/>
      <rect x="10" y="14" width="18" height="16" fill="#FFF3A8"/>
    </g>
  </g>

  <!-- Snowy ground and street -->
  <path d="M-10 352 L510 352 L510 470 L-10 470 Z" fill="url(#snow)" stroke="#1E2B40" stroke-width="3.5"/>
  <path d="M-10 418 L510 418 L510 452 L-10 452 Z" fill="#4A5262" stroke="#1E2B40" stroke-width="3"/>
  <g fill="#FFD23F">
    <rect x="12" y="432" width="34" height="6" rx="2"/><rect x="82" y="432" width="34" height="6" rx="2"/>
    <rect x="152" y="432" width="34" height="6" rx="2"/><rect x="222" y="432" width="34" height="6" rx="2"/>
    <rect x="292" y="432" width="34" height="6" rx="2"/><rect x="362" y="432" width="34" height="6" rx="2"/>
    <rect x="432" y="432" width="34" height="6" rx="2"/>
  </g>

  <!-- Snowman, on the snowbank -->
  <g stroke="#1E2B40" stroke-width="3" stroke-linejoin="round">
    <circle cx="452" cy="392" r="20" fill="#FFFFFF"/>
    <circle cx="452" cy="361" r="14" fill="#FFFFFF"/>
    <path d="M437 368 Q452 376 467 368 L469 374 Q452 382 435 374 Z" fill="#E8483B"/>
    <path d="M452 361 L469 364 L452 366 Z" fill="#FF8A1F"/>
    <rect x="439" y="334" width="26" height="17" fill="#1E2B40"/>
    <rect x="433" y="349" width="38" height="5" fill="#1E2B40"/>
  </g>
  <g fill="#1E2B40"><circle cx="447" cy="357" r="2"/><circle cx="457" cy="357" r="2"/><circle cx="452" cy="387" r="2.2"/><circle cx="452" cy="398" r="2.2"/></g>

  <!-- Falling snow -->
  <g fill="#FFFFFF" stroke="#9FCBEA" stroke-width="1">
    <circle cx="20" cy="140" r="4"/><circle cx="96" cy="210" r="3"/><circle cx="160" cy="160" r="4"/>
    <circle cx="250" cy="120" r="3"/><circle cx="330" cy="100" r="4"/><circle cx="350" cy="190" r="3"/>
    <circle cx="470" cy="170" r="4"/><circle cx="130" cy="240" r="3"/><circle cx="290" cy="230" r="3"/>
    <circle cx="400" cy="250" r="3.5"/><circle cx="60" cy="440" r="3"/><circle cx="300" cy="440" r="3.5"/>
  </g>
</svg>
