# N64Recomp config: South Park (USA)
[input]
entrypoint = 0x80000400
symbols_file_path = "southpark.us.syms.toml"
rom_file_path = "southpark.us.z64"
output_func_path = "RecompiledFuncs"
functions_per_output_file = 200
# Portable float-to-int conversions (see include/sp_recomp.h).
recomp_include = "#include \"sp_recomp.h\""

[patches]
# Functions that use CPU control registers (TLB, interrupts, caches, exceptions).
# The PC runtime has to provide its own versions of these.
stubs = [
    "func_002A0494",
    "func_002A01AC",
    "func_00291194",
    "func_00410E74",  # orphaned 4-byte `j` before func_00410E78, never called
    "func_002A53A0",
    "boot_map_tlb",
    "map_tlb",
    "func_00291218",
    "func_00291254",
    "func_0027D704",
    "func_0029E1B0",
    "func_0029E8AC",
    "func_0029EAB0",
    "func_002A0140",
    "func_002A0160",
    "func_002A0170",
    "func_002A0190",
    "func_002A01B0",
    "func_002A0248",
    "func_002A02B0",
    "func_002A0378",
    "func_002A0398",
    "func_002A0440",
    "func_002A0450",
    "func_002A0498",
    "func_002A0500",
    "func_002A51B0",
    "func_002A52CC",
    "func_002A52E8",
    "func_002A5304",
    "func_002A5310",
    "func_002A531C",
    "func_002A5828",
    "func_002A58EC",
]

# Blank out the boot stub's TLB writes; it still jumps to game_boot afterwards.
[[patches.instruction]]
func = "recomp_entrypoint"
vram = 0x80000434
value = 0x00000000

[[patches.instruction]]
func = "recomp_entrypoint"
vram = 0x80000438
value = 0x00000000

[[patches.instruction]]
func = "recomp_entrypoint"
vram = 0x80000440
value = 0x00000000

[[patches.instruction]]
func = "recomp_entrypoint"
vram = 0x80000444
value = 0x00000000

[[patches.instruction]]
func = "recomp_entrypoint"
vram = 0x80000448
value = 0x00000000

[[patches.instruction]]
func = "recomp_entrypoint"
vram = 0x80000450
value = 0x00000000

[[patches.instruction]]
func = "recomp_entrypoint"
vram = 0x80000464
value = 0x00000000

# func_00404D24 starts with `j 0x00405D38` into the tail of another function
# (jr ra / v0 = 0). Rewrite it in place with identical behavior.
[[patches.instruction]]
func = "func_00404D24"
vram = 0x00404D24
value = 0x00001021   # addu v0, zero, zero

[[patches.instruction]]
func = "func_00404D24"
vram = 0x00404D28
value = 0x03E00008   # jr ra

[[patches.instruction]]
func = "func_00404D24"
vram = 0x00404D2C
value = 0x27BDFFE8   # addiu sp, sp, -0x18 (delay slot, as in the original)

