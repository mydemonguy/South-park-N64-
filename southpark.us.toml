# N64Recomp config: South Park (USA)
[input]
entrypoint = 0x80000400
symbols_file_path = "southpark.us.syms.toml"
rom_file_path = "southpark.us.z64"
output_func_path = "RecompiledFuncs"
functions_per_output_file = 200
# Portable float-to-int conversions (see include/sp_recomp.h).
recomp_include = "#include \"sp_recomp.h\""

[patches]
# Generated by tools/gen_config.py.
# South Park runtime implementations (src/game/southpark_os.cpp): not emitted, callers link to ours.
ignored = [
    "sp_cart_io_read",
    "sp_cart_io_write",
    "sp_osAiGetStatus",
    "sp_osMapTLB",
    "sp_osPiRawStartDma",
    "sp_osSetEventMesg",
    "sp_osSetThreadPri",
    "sp_osUnmapTLB",
    "sp_osUnmapTLBAll",
    "sp_osViSwapBuffer",
    "sp_osVirtualToPhysical",
]

# Unnamed code that uses CP0/TLB/cache instructions and can't be recompiled.
stubs = [
    "boot_map_tlb",
    "func_0027D704",
    "func_00291194",
    "func_00291254",
    "func_0029E1C0",
    "func_0029E7A8",
    "func_002A015C",
    "func_002A016C",
    "func_002A01AC",
    "func_002A0494",
    "func_002A51B0",
    "func_002A51E8",
    "func_002A52CC",
    "func_002A52E8",
    "func_002A5304",
    "func_002A5310",
    "func_002A531C",
    "func_002A53A0",
    "func_002A576C",
    "func_002A5828",
    "func_002A58EC",
    "func_00410E74",
]

# Blank out the boot stub's TLB writes (it still jumps to game_boot afterwards) and the
# `break` after that call, which is reached here because the call returns once the game's
# threads are running.
[[patches.instruction]]
func = "recomp_entrypoint"
vram = 0x80000434
value = 0x00000000

[[patches.instruction]]
func = "recomp_entrypoint"
vram = 0x80000438
value = 0x00000000

[[patches.instruction]]
func = "recomp_entrypoint"
vram = 0x80000440
value = 0x00000000

[[patches.instruction]]
func = "recomp_entrypoint"
vram = 0x80000444
value = 0x00000000

[[patches.instruction]]
func = "recomp_entrypoint"
vram = 0x80000448
value = 0x00000000

[[patches.instruction]]
func = "recomp_entrypoint"
vram = 0x80000450
value = 0x00000000

[[patches.instruction]]
func = "recomp_entrypoint"
vram = 0x80000464
value = 0x00000000

[[patches.instruction]]
func = "recomp_entrypoint"
vram = 0x800004AC
value = 0x00000000

# game_boot copies the 1 MB boot image itself by polling PI_STATUS and reading the
# cartridge through KSEG1 (0xB0001000), neither of which is mapped. The runtime has
# already loaded exactly that image before calling the entry point, so branch over the
# copy loop to the BSS clear: 0x0022BD10 = b 0x0022BD44.
[[patches.instruction]]
func = "game_boot"
vram = 0x0022BD10
value = 0x1000000C

# func_00404D24 starts with `j 0x00405D38` into the tail of another function
# (jr ra / v0 = 0). Rewrite it in place with identical behavior.
[[patches.instruction]]
func = "func_00404D24"
vram = 0x00404D24
value = 0x00001021   # addu v0, zero, zero

[[patches.instruction]]
func = "func_00404D24"
vram = 0x00404D28
value = 0x03E00008   # jr ra

[[patches.instruction]]
func = "func_00404D24"
vram = 0x00404D2C
value = 0x27BDFFE8   # addiu sp, sp, -0x18 (delay slot, as in the original)

# Demand paging: the VM manager's region create (func_00290FAC, new node in $t0) and
# free (func_00290EAC, unlinked node in $s0) tell the runtime, which pages regions in
# from its SIGSEGV handler and must drop them when a virtual range is reused.
[[patches.hook]]
func = "func_00290FAC"
before_vram = 0x00291050
text = "southpark_vm_region_changed(rdram, (uint32_t)ctx->r8, 0);"

[[patches.hook]]
func = "func_00290EAC"
before_vram = 0x00290F10
text = "southpark_vm_region_changed(rdram, (uint32_t)ctx->r16, 1);"

# Scheduler: __scHandleRSP / __scHandleRDP dereference sc->curRSPTask / curRDPTask
# unchecked; ignore (and log) a done message that arrives with no task running.
[[patches.hook]]
func = "func_00258134"
text = "if (southpark_sched_guard(rdram, ctx, 0)) return;"

[[patches.hook]]
func = "func_00258618"
text = "if (southpark_sched_guard(rdram, ctx, 1)) return;"

[[patches.hook]]
func = "func_00258F40"
text = "southpark_sched_trace(rdram, ctx);"

# View Distance (General tab). The camera keeps the current area's draw distance at
# +0x4F0 (blended between areas by func_0025AFD4). Scale it where it is used for drawing
# only -- other readers (func_0023EE60, func_00271808) keep the game's own value:
# the far plane of the world projection (guPerspectiveF's `far` argument, stored at 0x14($sp)).
[[patches.hook]]
func = "func_0025B68C"
before_vram = 0x0025BFAC
text = "ctx->f1.fl *= southpark_view_distance_scale(); southpark_bot_camera(rdram, ctx->r19);"

# The radius of the box of level blocks gathered around the camera (+0x348..+0x354).
[[patches.hook]]
func = "func_0025B68C"
before_vram = 0x0025C184
text = "ctx->f23.fl *= southpark_view_distance_scale();"

# The culling frustum: the width/height of its far end, then its depth.
[[patches.hook]]
func = "func_0025B68C"
before_vram = 0x0025C1A0
text = "ctx->f20.fl *= southpark_view_distance_scale();"

[[patches.hook]]
func = "func_0025B68C"
before_vram = 0x0025C1EC
text = "ctx->f0.fl *= southpark_view_distance_scale();"

# Objects fade out as their depth nears the draw distance.
[[patches.hook]]
func = "func_00252870"
before_vram = 0x00253448
text = "ctx->f2.fl *= southpark_view_distance_scale();"

# Widescreen. RT64 widens the 3D view around the game's 4:3 picture, but the game culls to
# 4:3, so the sides stay empty. Its frustum and the level-block box are both built from the
# horizontal half-angle in $f21 (fovy * aspect * k, just computed): widen it to match.
[[patches.hook]]
func = "func_0025B68C"
before_vram = 0x0025C164
text = "ctx->f21.fl = sp_widen_half_angle(ctx->f21.fl);"
