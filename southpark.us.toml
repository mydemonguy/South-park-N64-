# N64Recomp config: South Park (USA)
[input]
entrypoint = 0x80000400
symbols_file_path = "southpark.us.syms.toml"
rom_file_path = "southpark.us.z64"
output_func_path = "RecompiledFuncs"
functions_per_output_file = 200
# Portable float-to-int conversions (see include/sp_recomp.h).
recomp_include = "#include \"sp_recomp.h\""

[patches]
# Generated by tools/gen_config.py.
# South Park runtime implementations (src/game/southpark_os.cpp): not emitted, callers link to ours.
ignored = [
    "sp_cart_io_read",
    "sp_cart_io_write",
    "sp_osMapTLB",
    "sp_osPiRawStartDma",
    "sp_osSetEventMesg",
    "sp_osUnmapTLB",
    "sp_osUnmapTLBAll",
]

# Unnamed code that uses CP0/TLB/cache instructions and can't be recompiled.
stubs = [
    "boot_map_tlb",
    "func_0027D704",
    "func_00291194",
    "func_00291254",
    "func_0029E1C0",
    "func_0029E7A8",
    "func_002A015C",
    "func_002A016C",
    "func_002A01AC",
    "func_002A0494",
    "func_002A51B0",
    "func_002A51E8",
    "func_002A52CC",
    "func_002A52E8",
    "func_002A5304",
    "func_002A5310",
    "func_002A531C",
    "func_002A53A0",
    "func_002A576C",
    "func_002A5828",
    "func_002A58EC",
    "func_00410E74",
]

# Blank out the boot stub's TLB writes (it still jumps to game_boot afterwards) and the
# `break` after that call, which is reached here because the call returns once the game's
# threads are running.
[[patches.instruction]]
func = "recomp_entrypoint"
vram = 0x80000434
value = 0x00000000

[[patches.instruction]]
func = "recomp_entrypoint"
vram = 0x80000438
value = 0x00000000

[[patches.instruction]]
func = "recomp_entrypoint"
vram = 0x80000440
value = 0x00000000

[[patches.instruction]]
func = "recomp_entrypoint"
vram = 0x80000444
value = 0x00000000

[[patches.instruction]]
func = "recomp_entrypoint"
vram = 0x80000448
value = 0x00000000

[[patches.instruction]]
func = "recomp_entrypoint"
vram = 0x80000450
value = 0x00000000

[[patches.instruction]]
func = "recomp_entrypoint"
vram = 0x80000464
value = 0x00000000

[[patches.instruction]]
func = "recomp_entrypoint"
vram = 0x800004AC
value = 0x00000000

# game_boot copies the 1 MB boot image itself by polling PI_STATUS and reading the
# cartridge through KSEG1 (0xB0001000), neither of which is mapped. The runtime has
# already loaded exactly that image before calling the entry point, so branch over the
# copy loop to the BSS clear: 0x0022BD10 = b 0x0022BD44.
[[patches.instruction]]
func = "game_boot"
vram = 0x0022BD10
value = 0x1000000C

# func_00404D24 starts with `j 0x00405D38` into the tail of another function
# (jr ra / v0 = 0). Rewrite it in place with identical behavior.
[[patches.instruction]]
func = "func_00404D24"
vram = 0x00404D24
value = 0x00001021   # addu v0, zero, zero

[[patches.instruction]]
func = "func_00404D24"
vram = 0x00404D28
value = 0x03E00008   # jr ra

[[patches.instruction]]
func = "func_00404D24"
vram = 0x00404D2C
value = 0x27BDFFE8   # addiu sp, sp, -0x18 (delay slot, as in the original)
